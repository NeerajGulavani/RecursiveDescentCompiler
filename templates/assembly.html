<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Target Assembly Output</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --accent: #38bdf8;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 2rem; }
        h2 { color: var(--accent); margin-bottom: 1rem; }
        pre { background: #090d16; color: #4ade80; padding: 1.5rem; border-radius: 0.5rem; border: 1px solid var(--border-color); font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; word-break: break-all; overflow-x: auto; }
        .btn { display: inline-block; margin-bottom: 1.5rem; padding: 0.5rem 1rem; background: var(--accent); color: #0f172a; text-decoration: none; border-radius: 0.375rem; font-weight: 600; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <a href="/" class="btn">&larr; Back to Compiler Dashboard</a>
    <h2>Generated x86-64 Target Assembly (output.s)</h2>
    <pre>{{ assembly_code }}</pre>
</body>
</html>
